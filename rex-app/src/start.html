<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REX</title>
    <script type="module" src="/assets/rex-tab.js"></script>
    <script src="/assets/gamepads.min.js"></script>
    <script type="module">
      import {LitElement, css, html} from '/assets/lit-core.min.js';

      export class SearchBox extends LitElement {
        static styles = css`
        #search {
          position: fixed;
          top: calc(var(--tab-heigth) + 1px);
          left: 50%;
          transform: translateX(-50%);
          width: 80%;
          background: #111;
          color: #fff;
          border: 1px solid #333;

          & input, ul {
            margin: 0;
          }

          & ul {
            padding: 0;
          }

          & input, li {
            padding: var(--pico-form-element-spacing-vertical) var(--pico-form-element-spacing-horizontal);
          }

          & li {
            list-style: none;
            cursor: pointer;
          }
          & li.selected {
            background-color: var(--pico-mark-background-color);
            color: #ffffff;
          }
        }
        `;

        render() {
          return html`
            <link rel="stylesheet" href="/assets/pico.min.css">
            <div id="search" @keydown="${this.handleKeyDown}" @focusout="${this.closePalette}">
              <input
                id="search-input"
                placeholder="Open…"
                onfocus="this.select()"
                @input="${this.handleInput}"
              />
              <ul id="search-results">
                ${this.filtered.map((item, i) =>
                  html`
                    <li
                      class="${this.selectedIndex === i ? 'selected' : ''}"
                      @mouseenter="${() => this.selectedIndex = i}"
                      @mousedown="${(e) => e.preventDefault()}"
                      @click="${() => this.selectItem(item)}"
                    >
                      ${item.name}
                    </li>
                  `
                )}
              </ul>
            </div>
          `;
        }

        static properties = {
          items: { state: true },
          selectedIndex: { state: true },
          query: { type: String },
        };

        constructor() {
          super();
          this.hidden = true;
          this.items = [];
          this.selectedIndex = 0;
          this.query = '';
        }

        get filtered() {
          return this.items.filter(item =>
            item.name.toLowerCase().includes(this.query.toLowerCase())
          );
        }

        async connectedCallback() {
          super.connectedCallback();
          window.addEventListener("keydown", this.handleWindowKeydown.bind(this));
        }

        async disconnectedCallback() {
          super.disconnectedCallback();
          window.removeEventListener('keydown', this.handleWindowKeydown.bind(this));
        }

        get searchItems() {
          return Array.from(this.renderRoot.querySelectorAll('li'));
        }

        handleWindowKeydown(e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "p") {
            this.openPalette();
            e.preventDefault();
          }
        }

        handleKeyDown(e) {
          const currIdx = this.searchItems.indexOf(e.target);

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            this.selectedIndex = (this.selectedIndex + 1) % this.searchItems.length;
          }
          else if (e.key === 'ArrowUp') {
            e.preventDefault();
            this.selectedIndex = (this.selectedIndex - 1 + this.searchItems.length) % this.searchItems.length;
          }
          else if (e.key === 'Enter') {
            this.selectItem(this.filtered[this.selectedIndex]);
          }
          else if (e.key === 'Escape') {
            this.hidden = true;
          }
        }

        handleInput(e) {
          this.query = e.target.value;
          this.selectedIndex = 0;
        }

        async openPalette() {
          this.hidden = false;
          this.shadowRoot.querySelector('#search-input').focus();

          this.items = await window.__TAURI__.core.invoke("list_plugins");
        }

        closePalette(e) {
          if (e.relatedTarget && this.shadowRoot.contains(e.relatedTarget)) {
            return;
          }

          this.hidden = true;
        }

        selectItem(item) {
          this.hidden = true;
          this.query = '';
          console.log('Executing:', item.name);
        }
      }
      customElements.define('search-box', SearchBox);
    </script>
    <script type="module">
      const tauriWindow = window.__TAURI__.window;

      window.addEventListener("keydown", async function(e) {
        if (e.key !== 'F11') return;

        const win = await window.__TAURI__.window.getCurrentWindow();
        await win.setFullscreen(!await win.isFullscreen());
      });

      // Gamepad logic

      let activeGamepad = null;
      const GAMEPAD_RIGHT_AXIS_Y = 3;
      const GAMEPAD_BUTTON_L = 4;
      const GAMEPAD_BUTTON_R = 5;
      const GAMEPAD_BUTTON_L2 = 6;
      const GAMEPAD_SCROLL_MULT = 40;
      const GAMEPAD_SCROLL_DEADZONE = 5;

      Gamepads.start();

      Gamepads.addEventListener('connect', e => {
        if (activeGamepad !== null) return;

        activeGamepad = e.gamepad.gamepad.index;
        requestAnimationFrame(handleGamepadScrolling);

        e.gamepad.addEventListener('buttonpress', async e => {
          const currentWindow = tauriWindow.getCurrentWindow();
          const windowHasFocus = await currentWindow.isFocused();

          if (e.index === GAMEPAD_BUTTON_L2) {
            bringAppToFront(currentWindow)
          }

          if (!windowHasFocus) return;

          const tab = document.querySelector('rex-tab[open]')

          if (e.index === GAMEPAD_BUTTON_L && tab.previousElementSibling) {
            tab.open = false;
            tab.previousElementSibling.open = true;
          } else if (e.index === GAMEPAD_BUTTON_R && tab.nextElementSibling) {
            tab.open = false;
            tab.nextElementSibling.open = true;
          }
        });

        e.gamepad.addEventListener('buttonrelease', async e => {
          if (e.index === GAMEPAD_BUTTON_L2) {
            const currentWindow = tauriWindow.getCurrentWindow();

            sendAppToBack(currentWindow)
          }
        });
      });

      Gamepads.addEventListener('disconnect', e => {
        if (e.gamepad.gamepad.index === activeGamepad) {
          activeGamepad = null;
        }
      });

      function bringAppToFront(currentWindow) {
        currentWindow.unminimize();
        currentWindow.setFocus();
        currentWindow.setAlwaysOnTop(true);
      }

      function sendAppToBack(currentWindow) {
        currentWindow.setAlwaysOnTop(false);
        currentWindow.minimize();
      }

      function handleGamepadScrolling() {
        if (activeGamepad === null) return;

        const gamepad = navigator.getGamepads()[activeGamepad];
        const tab = document.querySelector('rex-tab[open]')

        const amount = (Math.round(gamepad.axes[GAMEPAD_RIGHT_AXIS_Y] * 10) / 10) * GAMEPAD_SCROLL_MULT;
        if (Math.abs(amount) > GAMEPAD_SCROLL_DEADZONE) {
          tab.postMessage({type: "scroll", amount: amount})
          console.log('scroll', amount)
        }

        requestAnimationFrame(handleGamepadScrolling);
      };
    </script>
    <script>
      const TABS_STATE_KEY = 'tabset_state';

      function saveState() {
        const allTabs = document.querySelectorAll('rex-tab[group="tabs"]');

        const state = {
          active: document.querySelector('rex-tab[group="tabs"][open]')?.name || null,
          visible: Array.from(allTabs).map(tab => tab.name)
        };

        localStorage.setItem(TABS_STATE_KEY, JSON.stringify(state));
      }

      function loadState() {
        const savedState = localStorage.getItem(TABS_STATE_KEY);
        if (!savedState) return;

        const { active, _visible } = JSON.parse(savedState);
        const allTabs = document.querySelectorAll('rex-tab[group="tabs"]');

        allTabs.forEach(tab => {
          tab.open = (tab.name === active);
        });
      }

      window.addEventListener('DOMContentLoaded', loadState);
    </script>
    <style>
      :root {
        --tab-heigth: 38px;
        --tab-content-heigth: calc(100dvh - var(--tab-heigth));
      }

      html {
        height: 100vh;
      }

      body {
        height: 100dvh;
      }

      .tabset {
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: repeat(20, max-content) 1fr;
      }

      .tabset {
        height: 100dvh;
        width: 100%;
      }
    </style>

    <script>
      document.querySelector('.tabset').addEventListener('toggleOn', function (e) {
        const openDetails = Array.from(e.currentTarget.querySelectorAll('rex-tab[open], details[open]'));
        openDetails.filter((el) => el !== e.target).forEach((el) => {
          el.open = false;
        });
        setTimeout(() => saveState());
      });

      document.querySelector('.tabset').addEventListener('toggleOff', function (e) {
        const openDetails = Array.from(e.currentTarget.querySelectorAll('rex-tab[open], details[open]'));
        if (openDetails.includes(e.target)) {
          e.preventDefault();
        }
      });
    </script>

    <script>
      window.addEventListener('message', function(e) {
        // console.log(e);
        if (e.data.type === 'keydown') {
          window.dispatchEvent(new KeyboardEvent(e.data.type, e.data));
        } else if(e.data.type === 'error') {
          window.dispatchEvent(new ErrorEvent(e.data.type, e.data));
        }
      });

      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "r") {
          window.location.reload();
        }
      });

      window.addEventListener('error', function(e) {
        const errIcon = document.createElement('div');
        errIcon.style = `position: absolute; top: 4px; right: 4px; width: 28px;`;
        errIcon.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#F06048">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>`;
        document.body.append(errIcon);
      })
    </script>
  </body>
