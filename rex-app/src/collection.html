<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection</title>
  </head>
  <body>
    <script type="module" src="/assets/rex-collection.js"></script>
    <main class="container">
      <rex-collection></rex-collection>
    </main>
    <script type="module">
      const tauri = window.parent.window.__TAURI__;
      const Database = tauri.sql;
      const db = await Database.get('sqlite:rex.db');

      async function fetchData() {
        return await db.select(`
          SELECT *
          FROM rex_collection
          ORDER BY path;
        `);
      }

      async function scan(path) {
        const start = performance.now();
        const data = await tauri.core.invoke('scan_collection_dir', {
          basePath: path,
          ignorePatterns: ['**/*.txt', '**/*.bat', '**/*.exe'],
        });
        const end = performance.now();;

        const duration = end - start;
        console.log(`Execution time: ${duration} milliseconds`);

        return data;
      };

      const rexCollection = document.querySelector('rex-collection');

      rexCollection.entries = await fetchData();

      rexCollection.addEventListener('rex-scan-collection', async (e) => {
        const { entry } = e.detail;

        rexCollection.updateEntryBy((e) => e.path === entry.path, { scanned: 0 });

        setTimeout(() => scan(entry.path), 200);
      });

      rexCollection.addEventListener('rex-add-collection', async (_) => {
        let path = await tauri.dialog.open({multiple: false, directory: true});

        if (path === null) return;

        path = path.replaceAll('\\', '/');

        const result = await db.select(`
          INSERT INTO rex_collection
          (path)
          VALUES ($1)
          ON CONFLICT(path) DO UPDATE SET
            path = excluded.path
          RETURNING ID
        `, [path]);

        console.log(result);

        rexCollection.entries = await fetchData();
      });

      tauri.event.listen('scan-started', (event) => {
        const [total, path] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { total });
      });
      tauri.event.listen('scan-progress', (event) => {
        const [scanned, path, subPath] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { scanned });
      });
      tauri.event.listen('scan-finished', (event) => {
        const [total, path] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { total });
      });

    </script>
  </body>
</html>
