<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection</title>
  </head>
  <body>
    <style>
      .scan-collection {
        display: grid;
        grid-template-rows: 1fr;
        grid-template-columns: auto 1fr;

        button {
          grid-column: 1;
          justify-self: start;
        }

        progress {
          z-index: 1;
          grid-row: 1;
          grid-column: 2;
          margin: 0;
          opacity: 50%;
          block-size: auto;

          &.active {
            opacity: 100%;
          }
        }

        input {
          z-index: 2;
          grid-row: 1;
          grid-column: 2;
          margin: 0;
          background: transparent;
        }
      }
    </style>
    <script>
      const tauri = window.parent.window.__TAURI__;

      tauri.event.listen('scan-started', (event) => {
          const total = event.payload;
          // console.log(path);
          document.querySelector('.scan-collection progress').max = total;
      });
      tauri.event.listen('scan-progress', (event) => {
          const [count, path] = event.payload;
          // console.log(path);
          document.querySelector('.scan-collection progress').value = count;
      });
      tauri.event.listen('scan-finished', (event) => {
          const total = event.payload;
          document.querySelector('.scan-collection button').disabled = false;
          document.querySelector('.scan-collection progress').value = total;
          console.log(`Finished! Total files processed: ${total}`);
      });
      async function scan() {
        const start = performance.now();
        const data = await tauri.core.invoke('scan_collection_dir', {
          basePath: document.querySelector('.scan-collection input').value,
          ignorePatterns: ['**/*.txt', '**/*.bat', '**/*.exe'],
        });
        const end = performance.now();;

        const duration = end - start;
        console.log(`Execution time: ${duration} milliseconds`);

        return data;
      };

      async function doScan() {
        document.querySelector('.scan-collection button').disabled = true;
        document.querySelector('.scan-collection progress').value = 0;
        setTimeout(() => scan(), 200);
      }

      function savePath(event) {
        localStorage.setItem('rex-collection-path', event.target.value);
      }
      function loadPath() {
        document.querySelector('.scan-collection input').value = localStorage.getItem('rex-collection-path');
      }
      window.addEventListener('load', loadPath);
    </script>
    <main class="container">
      <h1>Collection</h1>
      <div class="scan-collection">
        <button onclick="doScan()">Scan collection</button>
        <progress value="0"></progress>
        <input type="text" name="path" placeholder="path" oninput="savePath(event)">
      </div>
    </main>
  </body>
</html>
