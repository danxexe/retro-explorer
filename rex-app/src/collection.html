<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection</title>
  </head>
  <body>
    <script type="module" src="/assets/rex-collection.js"></script>
    <script type="module" src="/assets/rex-collection-entries.js"></script>
    <main class="container">
      <rex-collection></rex-collection>
      <rex-collection-entries></rex-collection-entries>
    </main>
    <script type="module">
      const tauri = window.parent.window.__TAURI__;
      const Database = tauri.sql;
      const db = await Database.get('sqlite:rex.db');

      async function fetchData() {
        return await db.select(`
          SELECT *
          FROM rex_collection
          ORDER BY path;
        `);
      }

      async function fetchCollectionEntries() {
        // TODO: Plublish retroachievements.db and download on app start
        const radb_path = 'C:\\Users\\danxe\\Livebook\\retroachievements.db';

        const db_names = (await db.select(`
        PRAGMA database_list;
        `)).map(info => info.file);

        if (!db_names.includes(radb_path)) {
          await db.execute(`
          ATTACH DATABASE $1 AS ra;
          `, [radb_path]);
        }

        return await db.select(`
        select rcf.*, rag.Title, rag.ImageIcon as icon
        from rex_collection_files rcf
        left join ra.retroachievements_game_hashes ragh on ragh.Hash = rcf.rcheevos_hash
        left join ra.retroachievements_games rag on ragh.GameID = rag.ID
        where ragh.Hash is not null
        AND rag.NumAchievements > 0
        GROUP BY rag.ID
        ORDER BY fs_path COLLATE NOCASE;
        `);
      }

      async function scan(path) {
        const start = performance.now();
        const data = await tauri.core.invoke('scan_collection_dir', {
          basePath: path,
          ignorePatterns: ['**/*.txt', '**/*.bat', '**/*.exe'],
        });
        const end = performance.now();;

        const duration = end - start;
        console.log(`Execution time: ${duration} milliseconds`);

        return data;
      };

      const rexCollection = document.querySelector('rex-collection');

      rexCollection.entries = await fetchData();

      rexCollection.addEventListener('rex-add-collection', async (_) => {
        let path = await tauri.dialog.open({multiple: false, directory: true});

        if (path === null) return;

        path = path.replaceAll('\\', '/');

        const result = await db.select(`
          INSERT INTO rex_collection
          (path)
          VALUES ($1)
          ON CONFLICT(path) DO UPDATE SET
            path = excluded.path
          RETURNING ID
        `, [path]);

        rexCollection.entries = await fetchData();
      });

      rexCollection.addEventListener('rex-scan-collection', async (e) => {
        const { entry } = e.detail;

        rexCollection.updateEntryBy((e) => e.path === entry.path, { scanned: 0 });

        setTimeout(() => scan(entry.path), 200);
      });

      rexCollection.addEventListener('rex-delete-collection', async (e) => {
        const { entries } = e.detail;
        const entry_ids = entries.map(entry => entry.id);

        const result = await db.select(`
          DELETE FROM rex_collection
          WHERE id IN (SELECT value FROM json_each($1))
          RETURNING ID
        `, [JSON.stringify(entry_ids)]);

        rexCollection.entries = await fetchData();
      });

      tauri.event.listen('scan-started', (event) => {
        const [total, path] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { total });
      });
      tauri.event.listen('scan-progress', (event) => {
        const [scanned, path, subPath] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { scanned });
      });
      tauri.event.listen('scan-finished', (event) => {
        const [total, path] = event.payload;
        rexCollection.updateEntryBy((e) => e.path === path, { total });
      });


      // Collection entries

      const rexCollectionEntries = document.querySelector('rex-collection-entries');

      rexCollectionEntries.entries = await fetchCollectionEntries();

    </script>
  </body>
</html>
